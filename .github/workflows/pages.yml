name: Deploy to GitHub Pages

# A preview URL for stakeholders. It is not the production deploy — the IT
# team integrates these files into the real platform.
#
# Only the files the page actually serves are uploaded. raw/ holds the
# untouched Figma exports that tools/optimize.py consumes, and neither is
# ever requested by a browser.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Per ref, so a pull request cannot queue behind a deploy of main, and two
  # open pull requests do not serialise against each other.
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The checks run on pull requests as well as pushes. They used to live inside
  # build, which only ran after a merge, so every guard here reported a problem
  # that was already on main. The hryvnia font bug reached production that way.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: The three language files must stay structurally identical
        run: |
          for f in index.html ru.html en.html; do
            printf '%s: %s lines, %s tags\n' "$f" "$(wc -l < $f)" "$(grep -o '<' $f | wc -l)"
          done
          a=$(grep -o '<' index.html | wc -l)
          for f in ru.html en.html; do
            b=$(grep -o '<' $f | wc -l)
            if [ "$a" != "$b" ]; then
              echo "::error::$f has $b tags, index.html has $a. The files have drifted."
              echo "Compare them with: git diff --no-index --word-diff index.html $f"
              exit 1
            fi
          done

      - name: The tag sequences must match, element for element
        run: |
          python3 - <<'PY'
          import re, io
          seq = lambda p: re.findall(r'</?([a-zA-Z][\w-]*)', io.open(p, encoding='utf-8').read())
          a = seq('index.html')
          for f in ('ru.html', 'en.html'):
              b = seq(f)
              if a != b:
                  i = next(i for i, (x, y) in enumerate(zip(a + [None] * 9, b + [None] * 9)) if x != y)
                  raise SystemExit(
                      '::error::%s diverges at tag #%d: index.html has <%s>, %s has <%s>. '
                      'Compare them with: git diff --no-index --word-diff index.html %s'
                      % (f, i, a[i], f, b[i], f))
          print('tag sequences match: %d tags' % len(a))
          PY

      # Roboto has no hryvnia sign. Nobody noticed when the cards were redrawn
      # in hryvnia, because a missing glyph still renders in a fallback face.
      # This is the check that would have caught it.
      - name: Every character the page renders must exist in the shipped fonts
        run: |
          python3 -m pip install --quiet fonttools brotli
          python3 tools/fonts.py --check

  # parity reads the files; this one looks at the rendered page. The class of
  # bug it exists for is invisible to every text check: a `display: flex` that
  # was never scoped to [open] left the CLOSED dialog in flow, so the site
  # opened at its own footer with 650px of blank page under it, and CI was
  # green the whole time.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: The pages must open at the top, with nothing left in flow below the footer
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 tools/smoke.py

  build:
    needs: [parity, smoke]
    # A pull request gets the checks above and stops there. Only main is built
    # and deployed; configure-pages and upload-pages-artifact have no business
    # running on a branch that nobody has merged yet.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the served files
        run: |
          mkdir -p _site
          cp -r index.html ru.html en.html .nojekyll css js assets _site/
          du -sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
