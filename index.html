<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00002e">

<!-- GitHub Pages cannot set response headers, so the policy ships as a meta.
     The page references no external origin at all, and uses no data: URI, no
     eval and no worker, which is why every directive below is 'self' or none.

     style-src carries 'unsafe-inline' for two real reasons, not laziness: the
     noscript fallback near the end of this head is an inline style block, and
     js/flip.js sets style attributes — the stagger index on each winning card
     and will-change on a card mid-flip. Without it the no-JS fallback and the
     reveal stagger both break, and they break SILENTLY: a CSP violation shows
     up in the console and nowhere else.

     form-action is deliberately absent. It does not fall back to default-src,
     so the form stays free to POST wherever IT wires it (README section 2).
     Adding it here would break that wiring on the day it happens.
     frame-ancestors is absent because browsers ignore it in a meta policy;
     writing it here would only look like protection. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">

<!-- Static, because a crawler and a link preview read the head before any
     script runs. js/i18n.js then re-renders the title per language from
     campaign.js § strings, the same way tw-lp-template's index.html does.

     The description deliberately does NOT follow: a <meta> is not a data-i18n
     node and nothing re-renders it, so it stays in the default locale. That
     is the template's behaviour, and it is the one thing three separate HTML
     files used to give us for free.

     No <link rel="alternate" hreflang> any more, because there is nothing to
     point at: ru.html and en.html are gone and ?lang=ru is the same document,
     which is not a separate URL a crawler can index as Russian. This page is
     indexed in Ukrainian only. If search coverage in RU/EN is ever wanted,
     that needs real per-language URLs from the host's routing, not a link
     element here. -->
<title data-i18n="title">TopWin — Переверни картки, забери свій бонус!</title>
<meta name="description" content="Переверни три картки і забери вітальний бонус 250.000 ₴ + 250FS у TopWin.">

<!-- The brand's square mark, the same file on every Top Win landing. Not
     logo-topwin.svg, which is 247x44 of horizontal type and a smear at 16px.
     Without it the browser asks for /favicon.ico, which this repo does not
     ship and the deploy allowlist would not publish. -->
<link rel="icon" href="assets/img/favicon_topwin.svg" type="image/svg+xml">

<!-- The headline face, both cuts. crossorigin is required even same-origin:
     without it the preload is discarded and the font is fetched a second time.

     BOTH, because one file now serves all three languages. en.html used to
     swap this line for the -latin cut and there is no en.html any more, so a
     visitor who picks EN from the menu would otherwise watch the headline
     reflow while the latin cut is fetched. tw-lp-template preloads its two
     the same way, for the same reason. -->
<link rel="preload" as="font" type="font/woff2" crossorigin
      href="assets/fonts/roboto-var-black-italic-cyrillic.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin
      href="assets/fonts/roboto-var-black-italic-latin.woff2">

<!-- The registration card is tw-lp-template's, so its three stylesheets are
     too, unmodified. Order matters: reset, then tokens, then the card, then
     this landing's own sheet last so it wins where the two ever meet.

     css/reset.css is global by design and its file header says what to do
     when a landing is embedded rather than deployed on its own page: drop the
     html, body rule. This one is deployed on its own page. -->
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/form.css">
<link rel="stylesheet" href="css/styles.css">
<noscript><style>.fc-claim { display: block; }</style></noscript>
</head>
<body>

<!-- js/shell.js replaces these two markers with the header and the footer
     every Top Win landing shares, built from campaign.js.

     OUTSIDE .fc-root, deliberately. This page's reset is scoped to that
     wrapper — `.fc-root :where(p) { padding: 0 }` — and :where() carries no
     specificity, so against .tw-ftr__copy's own 0-1-0 rule it is a tie, and
     ties go to the file that loads last: css/styles.css. Inside the wrapper
     the shared footer lost the 16px above its copyright line and stood 129px
     tall against 145 everywhere else. The shell brings its own reset. -->
<div data-tw="header"></div>

<div class="fc-root">


  <main class="fc-hero">

    <picture class="fc-hero__bg">
      <!-- Order matters: both desktop entries carry media and come first,
           the mobile crop follows with none. First match wins, so reversing
           this makes every desktop visitor download the 375px mobile image. -->
      <source media="(min-width: 900px)" type="image/avif"
              srcset="assets/img/hero-1280.avif 1280w, assets/img/hero-1920.avif 1920w"
              sizes="100vw">
      <source media="(min-width: 900px)" type="image/webp"
              srcset="assets/img/hero-1280.webp 1280w, assets/img/hero-1920.webp 1920w"
              sizes="100vw">
      <source type="image/avif" srcset="assets/img/hero-m-375.avif">
      <source type="image/webp" srcset="assets/img/hero-m-375.webp">
      <img src="assets/img/hero-1280.webp" alt="" width="1920" height="1080"
           fetchpriority="high" decoding="async">
    </picture>

    <div class="fc-stage">

      <div class="fc-copy">
        <h1 class="fc-headline">
          <span class="fc-headline__a" data-i18n="hero.1">Переверни картки</span>
          <span class="fc-headline__b" data-i18n="hero.2">забери свій бонус!</span>
        </h1>
      </div>

      <section class="fc-game" aria-labelledby="fc-game-label">
        <h2 class="fc-sr" id="fc-game-label" data-i18n="game.label">Переверніть три картки та заберіть вітальний бонус</h2>

        <!-- The nine cards are built by js/flip.js from CONFIG.deck. Their
             prizes are shuffled on every load, their positions never are. -->
        <ul class="fc-grid" id="fc-grid"></ul>

        <div class="fc-progress" id="fc-progress" aria-hidden="true">
          <span class="fc-pip"></span><span class="fc-pip"></span><span class="fc-pip"></span>
        </div>

        <p class="fc-sr" id="fc-status" role="status" aria-live="polite"></p>

        <button class="fc-claim" id="fc-claim" type="button" data-i18n="cta.claim">Забрати бонус</button>
      </section>

    </div>
  </main>

</div>

<div data-tw="footer"></div>

<!-- defer, and the order IS the dependency graph: there is no bundler and no
     import anywhere in this repo. The five middle files are tw-lp-template's
     and are never edited here; campaign.js configures them and js/flip.js is
     the mechanic, which reaches the card through TWForm.open() and nothing
     else. -->
<script src="campaign.js" defer></script>
<script src="js/strings.js" defer></script>
<script src="js/i18n.js" defer></script>
<script src="js/form.js" defer></script>
<script src="js/shell.js" defer></script>
<script src="js/flip.js" defer></script>
</body>
</html>
